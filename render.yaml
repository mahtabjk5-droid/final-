services:
  - type: web
    name: bolmizan-khata-production
    runtime: node
    plan: starter
    buildCommand: rm -f bun.lock && npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: bolmizan-sqlite-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: "production"
